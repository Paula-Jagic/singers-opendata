<!DOCTYPE html>
<html lang="hr">
<head>

  <title>Prijava</title>

      background-color: #f4f4f4;

    button {

      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <h1>Dobrodošli</h1>
    <p>Prijavite se za nastavak</p>

    
    <a href="/login?returnTo=/home">

    </a>
  </div>

</body>
</html>
